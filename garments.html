<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Garments | Winter Collection</title>
<style>
/* ========== 1. VARIABLES (change colours here) ========== */
:root{
  --navy:#14213d; --navy-soft:#22335c; --cream:#fdf6ec; --cream-dark:#f3e6d0;
  --accent:#e4572e; --accent-dark:#c4431d; --gold:#f2a93b; --text:#2b2f3a;
  --muted:#6b7080; --white:#fff; --radius:16px;
  --shadow:0 6px 20px rgba(20,33,61,.10); --shadow-lg:0 14px 34px rgba(20,33,61,.18);
}

/* ========== 2. BASE ========== */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--cream);color:var(--text);line-height:1.6}
a{color:inherit;text-decoration:none}
.container{width:min(1140px,92%);margin:0 auto}
section{padding:72px 0}
h1,h2,h3{color:var(--navy);line-height:1.2}
.section-title{text-align:center;font-size:clamp(1.6rem,4vw,2.3rem);margin-bottom:8px}
.section-sub{text-align:center;color:var(--muted);margin-bottom:40px}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--accent);color:var(--white);
  font-size:1rem;font-weight:700;padding:12px 26px;border-radius:999px;transition:.25s}
.btn:hover{background:var(--accent-dark);transform:translateY(-2px);box-shadow:var(--shadow)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.pay-card:focus-within{outline:3px solid var(--gold);outline-offset:2px}

/* ========== 3. HEADER ========== */
header{position:sticky;top:0;z-index:50;background:var(--navy);box-shadow:var(--shadow)}
.header-inner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;padding:12px 0}
.logo{color:var(--white);font-size:1.5rem;font-weight:800;letter-spacing:.5px}
.logo span{color:var(--gold)}
nav ul{list-style:none;display:flex;flex-wrap:wrap;gap:4px 8px}
nav a{display:block;color:var(--cream);padding:8px 14px;border-radius:999px;font-weight:600;font-size:.95rem;transition:.2s}
nav a:hover,nav a:focus-visible{background:var(--accent);color:var(--white)}

/* ========== 4. HERO ========== */
.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-soft) 55%,#5a3a4a 100%);color:var(--cream);padding:90px 0}
.hero .container{display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.hero h1{color:var(--white);font-size:clamp(2rem,5.5vw,3.6rem);margin-bottom:16px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:1.15rem;max-width:480px;margin-bottom:28px;color:var(--cream-dark)}
.hero-art{font-size:clamp(6rem,16vw,11rem);text-align:center;filter:drop-shadow(0 10px 20px rgba(0,0,0,.3))}

/* ========== 5. PRODUCT GRID ========== */
.products{background:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.card{position:relative;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.pic{height:170px;display:flex;align-items:center;justify-content:center;font-size:4.5rem}
.pic.p1{background:linear-gradient(135deg,#fde2d3,#f6b79b)}
.pic.p2{background:linear-gradient(135deg,#d6e4ff,#9db7ee)}
.pic.p3{background:linear-gradient(135deg,#e8e0f5,#bfaee3)}
.pic.p4{background:linear-gradient(135deg,#ffe9b8,#f5c564)}
.pic.p5{background:linear-gradient(135deg,#ffd6d6,#f09a9a)}
.pic.p6{background:linear-gradient(135deg,#d9f0e6,#9fd5bd)}
.pic.p7{background:linear-gradient(135deg,#e2e8f0,#aab6c8)}
.pic.p8{background:linear-gradient(135deg,#f3e1cf,#d9ac85)}
.badge{position:absolute;top:12px;left:12px;background:var(--accent);color:var(--white);font-size:.75rem;
  font-weight:800;padding:4px 10px;border-radius:999px}
.badge.gold{background:var(--gold);color:var(--navy)}
.card-body{padding:18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:1.1rem}
.card .desc{color:var(--muted);font-size:.9rem;flex:1}
.stars{color:var(--gold);letter-spacing:2px}
.stars small{color:var(--muted);letter-spacing:0;margin-left:4px}
.price{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}
.price .old{color:var(--muted);text-decoration:line-through;font-size:.9rem}
.price .now{color:var(--accent);font-weight:800;font-size:1.3rem}
.card .btn{width:100%;text-align:center;padding:10px}

/* ========== 6. WHY CHOOSE US ========== */
.why{background:var(--navy);color:var(--cream)}
.why .section-title{color:var(--white)}
.why .section-sub{color:var(--cream-dark)}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.why-item{text-align:center;padding:24px 16px;background:var(--navy-soft);border-radius:var(--radius);transition:.25s}
.why-item:hover{transform:translateY(-5px);background:#2b3f6d}
.why-item .icon{font-size:2.6rem}
.why-item h3{color:var(--gold);margin:8px 0 4px;font-size:1.1rem}
.why-item p{font-size:.92rem;color:var(--cream-dark)}

/* ========== 7. OFFERS ========== */
.offers{padding:48px 0}
.offer-box{background:linear-gradient(120deg,var(--accent),var(--gold));border-radius:var(--radius);
  padding:36px;text-align:center;color:var(--navy);box-shadow:var(--shadow)}
.offer-box h2{color:var(--navy);margin-bottom:6px}
.offer-box strong{background:var(--navy);color:var(--gold);padding:2px 12px;border-radius:8px;letter-spacing:2px}

/* ========== 8. CHECKOUT ========== */
.checkout-layout{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;align-items:start}
.box{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px}
.box h3{margin-bottom:16px;font-size:1.25rem}
.summary li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px
